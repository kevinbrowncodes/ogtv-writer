# Local container run. `docker compose up --build` then open http://localhost:9001
#
# Notes:
#   - Reads your local .env for config (copy from .env.example first).
#   - Bind-mounts the host ./data into the container, so it uses your real SQLite
#     database (data/app.db) and shoot image folders (data/logline/...); anything
#     the app writes persists straight back to ./data. Swap to a named volume if
#     you want an isolated, throwaway instance instead.
#   - For Postgres, add a `db` service and set DATABASE_URL accordingly.

services:
  web:
    build: .
    # Pin the built image's name so `make docker-build` and Compose produce the SAME
    # image. Without this, Compose auto-names it <project>-<service> (ogtv-writer-web)
    # while `docker build -t ogtv-writer` tags ogtv-writer — two images, only one ever
    # run, leaving a stale orphan and "which image am I on?" ambiguity (STORY_021).
    image: ogtv-writer:latest
    ports:
      # host:container — host port is configurable via WEB_PORT (default 9001),
      # the container keeps listening internally on 8000 (so does the healthcheck).
      - "${WEB_PORT:-9001}:8000"
    env_file:
      - .env
    environment:
      # Override a few values so the container is production-ish regardless of .env.
      ENVIRONMENT: production
      DATABASE_URL: sqlite:///./data/app.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
