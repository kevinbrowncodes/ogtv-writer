{% extends "base.html" %}
{% block title %}Create account{% endblock %}

{% block body %}
<div class="flex min-h-screen items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex flex-col items-center gap-2 text-center">
      <img src="{{ url_for('static', path='icons/icon.svg') }}" alt="" class="h-10 w-10" />
      <h1 class="text-xl font-semibold tracking-tight">Create your account</h1>
      <p class="text-sm text-muted">Get started with {{ settings.app_name }}</p>
    </div>

    <div class="card p-6">
      {% if error %}
      <div class="mb-4 rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/signup" class="space-y-4">
        <div>
          <label class="label" for="name">Name</label>
          <input id="name" name="name" type="text" value="{{ name | default('') }}" class="input" autocomplete="name" />
        </div>
        <div>
          <label class="label" for="email">Email</label>
          <input id="email" name="email" type="email" required value="{{ email | default('') }}"
                 class="input" autocomplete="email" />
        </div>
        <div>
          <label class="label" for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="8"
                 class="input" autocomplete="new-password" />
          <p class="mt-1 text-xs text-muted">At least 8 characters.</p>
        </div>
        <button type="submit" class="btn-primary w-full">Create account</button>
      </form>
    </div>

    <p class="mt-4 text-center text-sm text-muted">
      Already have an account? <a href="/login" class="text-brand hover:underline">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
