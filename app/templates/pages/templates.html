{% extends "shell.html" %}
{% block page_title %}Templates{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Templates</h1>
      <p class="text-sm text-muted">Reusable script patterns and model-specific prompt structures.</p>
    </div>

    <button type="button" class="btn-primary" hx-get="/templates/new" hx-target="#modal" hx-swap="innerHTML">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      New template
    </button>
  </div>

  <div class="flex flex-wrap gap-3">
    <div class="relative min-w-0 flex-1 sm:max-w-md">
      <svg class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      <input
        type="search" name="q" value="{{ q }}" placeholder="Search templates…"
        class="input pl-10" autocomplete="off"
        hx-get="/templates/search" hx-trigger="input changed delay:300ms, search"
        hx-target="#template-list" hx-swap="outerHTML" hx-include="[name='category']"
      />
    </div>
    <select name="category" class="input sm:w-48"
      hx-get="/templates/search" hx-trigger="change"
      hx-target="#template-list" hx-swap="outerHTML" hx-include="[name='q']">
      <option value="" {% if not category %}selected{% endif %}>All categories</option>
      {% for value, label in TEMPLATE_CATEGORY_LABELS.items() %}
        <option value="{{ value }}" {% if category == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>

  {% include "partials/templates/_list.html" %}
</div>
{% endblock %}
