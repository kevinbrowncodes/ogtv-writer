{#
  Change-password form. Optional `saved` (bool), optional `error` (str).
  Inline-updates itself, just like the profile form.
#}
<form
  id="password-form"
  hx-post="/settings/password"
  hx-target="#password-form"
  hx-swap="outerHTML"
  class="space-y-4"
>
  <div>
    <label class="label" for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" class="input" autocomplete="current-password" />
  </div>

  <div>
    <label class="label" for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" class="input" autocomplete="new-password" />
    <p class="mt-1 text-xs text-muted">At least 8 characters.</p>
    {% if error %}<p class="field-error">{{ error }}</p>{% endif %}
  </div>

  <div class="flex items-center gap-3">
    <button type="submit" class="btn-primary">Update password</button>
    {% if saved %}<span class="text-sm text-success">Updated ✓</span>{% endif %}
  </div>
</form>
