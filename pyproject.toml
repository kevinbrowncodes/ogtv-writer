# ==============================================================================
# pyproject.toml — single source of truth for Python tooling
#
# OGTV Writer is an *application* (not a library), but we still declare it as an
# installable package so `pip install -e .` wires up imports cleanly and tooling
# (ruff, mypy, pytest) reads its config from one place. The import package stays
# `app/`, so internal imports never change.
# ==============================================================================

[project]
name = "ogtv-writer"
version = "0.1.0"
description = "OnlyGainsTV Writer — generate, organize, and export AI video scripts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# --- Runtime dependencies -----------------------------------------------------
# Kept intentionally small. Add app-specific deps below the marked line.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9", # parses HTML form submissions (HTMX hx-post)
    "itsdangerous>=2.2",       # signs the session cookie (flash messages)
    # >>> ADD APP-SPECIFIC RUNTIME DEPENDENCIES BELOW THIS LINE <<<
    "google-genai>=0.8",  # Gemini multimodal client (script generator)
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "httpx>=0.27",            # required by FastAPI's TestClient
    "playwright>=1.45",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Hatch needs an explicit hint because the package dir ("app") doesn't match the
# distribution name ("ogtv-writer").

# ==============================================================================
# Ruff — linter + formatter (replaces flake8, isort, black)
# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/static/js/vendor", "node_modules"]

[tool.ruff.lint]
# A pragmatic, not-overbearing rule set. Tweak per project.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by the formatter
    "B008", # FastAPI uses `Depends()` as a default arg — that's idiomatic here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# ==============================================================================
# mypy — static type checking
# ==============================================================================
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true # 3rd-party libs without stubs shouldn't block you
# Start lenient; tighten these as the codebase matures.
disallow_untyped_defs = false

# ==============================================================================
# pytest
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
# By default, run fast unit + integration tests. Playwright e2e tests are slower
# and need a browser, so they're excluded here and run via `make test-e2e`.
addopts = "-ra -q -m 'not e2e'"
markers = [
    "e2e: end-to-end browser tests (Playwright). Run with: pytest -m e2e",
]
